# Runs the test suite on Postgres (what Cloud SQL runs) for every push and pull request, once the repo is on GitHub.
name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acmi
          POSTGRES_USER: acmi
          POSTGRES_PASSWORD: acmi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: acmi
      POSTGRES_USER: acmi
      POSTGRES_PASSWORD: acmi
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: No model changes without a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test crm
      - name: Production settings check
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-placeholder-key-that-is-long-enough-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: hub.acmigroup.com

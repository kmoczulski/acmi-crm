<script>
  // Drag a .kcard to another .column; POST its new stage to the card's data-url.
  let dragged = null;
  document.querySelectorAll('.kcard').forEach(card => {
    card.addEventListener('dragstart', () => { dragged = card; card.style.opacity = .5; });
    card.addEventListener('dragend', () => { card.style.opacity = 1; });
  });
  document.querySelectorAll('.column').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop'));
    col.addEventListener('drop', async e => {
      e.preventDefault();
      col.classList.remove('drop');
      if (!dragged || dragged.parentElement === col) return;
      const from = dragged.parentElement;
      col.appendChild(dragged);
      const res = await csrfPost(dragged.dataset.url, {stage: col.dataset.stage});
      if (!res.ok) { from.appendChild(dragged); alert('Could not move the card.'); }
    });
  });
</script>

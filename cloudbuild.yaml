# Cloud Build trigger on the GitHub repo's main branch: build, push, migrate, deploy the jobs and the service.
#
# Set on the trigger: _SQL_INSTANCE (project:region:instance) and _GOOGLE_CLIENT_ID; the others have defaults.
# _HOSTS and _ORIGINS may list several values separated by commas (e.g. add the run.app address while DNS is set up).
# _BUCKET is the Cloud Storage bucket for uploads and outreach attachments (create it first; blank = local disk).
#
# Secrets come from Secret Manager; create them once before the first deploy:
#   acmi-django-secret-key (50+ random characters), acmi-postgres-password, acmi-cron-secret,
#   acmi-google-client-secret, acmi-anthropic-api-key, acmi-token-key (the ACMI_TOKEN_KEY from the laptop's .env, so
#   the stored Google tokens stay readable), acmi-vapid-public-key and acmi-vapid-private-key (the laptop's VAPID
#   pair, so browsers already subscribed keep working). No IMAP app password is passed: the one mailbox is on the Gmail
#   API. A mailbox moved back to IMAP would need an ACMI_IMAP_PASSWORD_<USER> secret added to the jobs and service.
# The service allows unauthenticated requests (Cloud Run's own gate); the app only signs in acmigroup.com accounts.
# 2 GiB because Chromium prints the site brief PDFs.
# Every job and the service get ACMI_TOKEN_KEY and the Google client: the sync reads Gmail and calendars with the
# stored tokens, and the send job sends through the Gmail API for anyone whose Mail in the hub is on.
# The Cloud Build service account needs Cloud Run Admin and Service Account User. The runtime service account needs
# Secret Manager Secret Accessor, Cloud SQL Client, Storage Object Admin on the bucket, and Cloud Run Developer on the
# ${_SERVICE}-send job (the web app starts it with the batch id when someone presses Send).
#
# Drive (read with the runtime service account, ACMI_DRIVE_ADC=true): _NEWS_FOLDER is the Drive folder ID of the
# weekly news scans (the News page reads it), _GRANOLA_FOLDER the one the daily Granola task uploads its JSON to (the
# sync job imports each new file once). Blank = off. Once, before relying on them: turn on the Google Drive API in the
# project, and share both folders with the runtime service account's email as Viewer.
#
# Once, after the first deploy, run the mail + calendar sync every 15 minutes:
#   gcloud scheduler jobs create http acmi-crm-sync --location=us-central1 --schedule="*/15 * * * *" \
#     --uri="https://run.googleapis.com/v2/projects/PROJECT_ID/locations/us-central1/jobs/acmi-crm-sync:run" \
#     --http-method=POST --oauth-service-account-email=RUNTIME_SERVICE_ACCOUNT
substitutions:
  _REGION: us-central1
  _SERVICE: acmi-crm
  _HOSTS: hub.acmiproperties.com
  _ORIGINS: https://hub.acmiproperties.com
  _DB_NAME: acmi
  _DB_USER: acmi
  _BUCKET: ""
  _NEWS_FOLDER: ""
  _GRANOLA_FOLDER: ""
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/acmi/${_SERVICE}:$SHORT_SHA", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/acmi/${_SERVICE}:$SHORT_SHA"]
  # Migrations run first, as a Cloud Run job from the new image with the service's database and secrets, so the
  # new code never starts against an old schema. The build stops here if a migration fails.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "jobs", "deploy", "${_SERVICE}-migrate",
           "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/acmi/${_SERVICE}:$SHORT_SHA", "--region=${_REGION}",
           "--set-cloudsql-instances=${_SQL_INSTANCE}",
           "--set-env-vars=^@^DJANGO_DEBUG=false@DJANGO_ALLOWED_HOSTS=${_HOSTS}@DJANGO_CSRF_TRUSTED_ORIGINS=${_ORIGINS}@ACMI_LOCAL_LOGIN=false@POSTGRES_DB=${_DB_NAME}@POSTGRES_USER=${_DB_USER}@POSTGRES_HOST=/cloudsql/${_SQL_INSTANCE}@GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}",
           "--set-secrets=DJANGO_SECRET_KEY=acmi-django-secret-key:latest,POSTGRES_PASSWORD=acmi-postgres-password:latest,ACMI_TOKEN_KEY=acmi-token-key:latest",
           "--command=python", "--args=manage.py,migrate,--noinput", "--max-retries=0", "--execute-now", "--wait"]
  # Outreach batches: the web app runs this job with "manage.py send_batch <id>" (crm/cloudrun.py).
  - id: send-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "jobs", "deploy", "${_SERVICE}-send",
           "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/acmi/${_SERVICE}:$SHORT_SHA", "--region=${_REGION}",
           "--set-cloudsql-instances=${_SQL_INSTANCE}", "--task-timeout=3600", "--max-retries=0",
           "--set-env-vars=^@^DJANGO_DEBUG=false@DJANGO_ALLOWED_HOSTS=${_HOSTS}@POSTGRES_DB=${_DB_NAME}@POSTGRES_USER=${_DB_USER}@POSTGRES_HOST=/cloudsql/${_SQL_INSTANCE}@ACMI_GCS_BUCKET=${_BUCKET}@GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}",
           "--set-secrets=DJANGO_SECRET_KEY=acmi-django-secret-key:latest,POSTGRES_PASSWORD=acmi-postgres-password:latest,GOOGLE_CLIENT_SECRET=acmi-google-client-secret:latest,ACMI_TOKEN_KEY=acmi-token-key:latest",
           "--command=python", "--args=manage.py,send_batch,0"]
  # Mail + calendar sync, run every 15 minutes by Cloud Scheduler (see the header).
  - id: sync-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "jobs", "deploy", "${_SERVICE}-sync",
           "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/acmi/${_SERVICE}:$SHORT_SHA", "--region=${_REGION}",
           "--set-cloudsql-instances=${_SQL_INSTANCE}", "--task-timeout=1800", "--max-retries=0",
           "--set-env-vars=^@^DJANGO_DEBUG=false@DJANGO_ALLOWED_HOSTS=${_HOSTS}@POSTGRES_DB=${_DB_NAME}@POSTGRES_USER=${_DB_USER}@POSTGRES_HOST=/cloudsql/${_SQL_INSTANCE}@GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}@ACMI_DRIVE_ADC=true@ACMI_GRANOLA_DRIVE_FOLDER=${_GRANOLA_FOLDER}",
           "--set-secrets=DJANGO_SECRET_KEY=acmi-django-secret-key:latest,POSTGRES_PASSWORD=acmi-postgres-password:latest,GOOGLE_CLIENT_SECRET=acmi-google-client-secret:latest,ACMI_TOKEN_KEY=acmi-token-key:latest,ANTHROPIC_API_KEY=acmi-anthropic-api-key:latest,ACMI_VAPID_PUBLIC_KEY=acmi-vapid-public-key:latest,ACMI_VAPID_PRIVATE_KEY=acmi-vapid-private-key:latest",
           "--command=python", "--args=manage.py,sync_all"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "${_SERVICE}",
           "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/acmi/${_SERVICE}:$SHORT_SHA", "--region=${_REGION}",
           "--add-cloudsql-instances=${_SQL_INSTANCE}", "--timeout=900", "--memory=2Gi", "--allow-unauthenticated",
           "--set-env-vars=^@^DJANGO_DEBUG=false@DJANGO_ALLOWED_HOSTS=${_HOSTS}@DJANGO_CSRF_TRUSTED_ORIGINS=${_ORIGINS}@ACMI_LOCAL_LOGIN=false@POSTGRES_DB=${_DB_NAME}@POSTGRES_USER=${_DB_USER}@POSTGRES_HOST=/cloudsql/${_SQL_INSTANCE}@GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}@ACMI_SEND_JOB=${_SERVICE}-send@ACMI_GCP_REGION=${_REGION}@ACMI_GCS_BUCKET=${_BUCKET}@ACMI_DRIVE_ADC=true@ACMI_NEWS_DRIVE_FOLDER=${_NEWS_FOLDER}",
           "--set-secrets=DJANGO_SECRET_KEY=acmi-django-secret-key:latest,POSTGRES_PASSWORD=acmi-postgres-password:latest,ACMI_CRON_SECRET=acmi-cron-secret:latest,GOOGLE_CLIENT_SECRET=acmi-google-client-secret:latest,ANTHROPIC_API_KEY=acmi-anthropic-api-key:latest,ACMI_TOKEN_KEY=acmi-token-key:latest,ACMI_VAPID_PUBLIC_KEY=acmi-vapid-public-key:latest,ACMI_VAPID_PRIVATE_KEY=acmi-vapid-private-key:latest"]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/acmi/${_SERVICE}:$SHORT_SHA"

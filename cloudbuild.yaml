# Cloud Build trigger on the GitHub repo's main branch: build, push, migrate, deploy.
#
# Set on the trigger: _SQL_INSTANCE (project:region:instance) and _GOOGLE_CLIENT_ID; the others have defaults.
# _HOSTS and _ORIGINS may list several values separated by commas (e.g. add the run.app address while DNS is set up).
#
# Secrets come from Secret Manager; create them once before the first deploy:
#   acmi-django-secret-key (50+ random characters), acmi-postgres-password, acmi-cron-secret,
#   acmi-google-client-secret, acmi-anthropic-api-key, acmi-imap-password-kellen (one per synced mailbox).
# The Cloud Build service account needs Cloud Run Admin and Service Account User; the Cloud Run runtime service
# account needs Secret Manager Secret Accessor and Cloud SQL Client.
#
# Outreach batches send from a background process after the page returns: either deploy with --no-cpu-throttling
# (CPU always allocated, costs more) or move sending to a Cloud Run job.
substitutions:
  _REGION: us-central1
  _SERVICE: acmi-crm
  _HOSTS: hub.acmigroup.com
  _ORIGINS: https://hub.acmigroup.com
  _DB_NAME: acmi
  _DB_USER: acmi
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/acmi/${_SERVICE}:$SHORT_SHA", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/acmi/${_SERVICE}:$SHORT_SHA"]
  # Migrations run first, as a Cloud Run job from the new image with the service's database and secrets, so the
  # new code never starts against an old schema. The build stops here if a migration fails.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "jobs", "deploy", "${_SERVICE}-migrate",
           "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/acmi/${_SERVICE}:$SHORT_SHA", "--region=${_REGION}",
           "--set-cloudsql-instances=${_SQL_INSTANCE}",
           "--set-env-vars=^@^DJANGO_DEBUG=false@DJANGO_ALLOWED_HOSTS=${_HOSTS}@DJANGO_CSRF_TRUSTED_ORIGINS=${_ORIGINS}@ACMI_LOCAL_LOGIN=false@POSTGRES_DB=${_DB_NAME}@POSTGRES_USER=${_DB_USER}@POSTGRES_HOST=/cloudsql/${_SQL_INSTANCE}@GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}",
           "--set-secrets=DJANGO_SECRET_KEY=acmi-django-secret-key:latest,POSTGRES_PASSWORD=acmi-postgres-password:latest",
           "--command=python", "--args=manage.py,migrate,--noinput", "--max-retries=0", "--execute-now", "--wait"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "${_SERVICE}",
           "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/acmi/${_SERVICE}:$SHORT_SHA", "--region=${_REGION}",
           "--add-cloudsql-instances=${_SQL_INSTANCE}", "--timeout=900",
           "--set-env-vars=^@^DJANGO_DEBUG=false@DJANGO_ALLOWED_HOSTS=${_HOSTS}@DJANGO_CSRF_TRUSTED_ORIGINS=${_ORIGINS}@ACMI_LOCAL_LOGIN=false@POSTGRES_DB=${_DB_NAME}@POSTGRES_USER=${_DB_USER}@POSTGRES_HOST=/cloudsql/${_SQL_INSTANCE}@GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}",
           "--set-secrets=DJANGO_SECRET_KEY=acmi-django-secret-key:latest,POSTGRES_PASSWORD=acmi-postgres-password:latest,ACMI_CRON_SECRET=acmi-cron-secret:latest,GOOGLE_CLIENT_SECRET=acmi-google-client-secret:latest,ANTHROPIC_API_KEY=acmi-anthropic-api-key:latest,ACMI_IMAP_PASSWORD_KELLEN=acmi-imap-password-kellen:latest"]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/acmi/${_SERVICE}:$SHORT_SHA"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
  /* Avery 5160 / 8160: letter paper, 3 x 10 labels of 2 5/8" x 1", 1/2" top margin, 3/16" sides, 1/8" between columns.
     Print at actual size (100%), not "fit to page". */
  @page { size: letter; margin: 0; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; }
  .sheet { width: 8.5in; height: 11in; box-sizing: border-box; padding: 0.5in 0 0 0.1875in; display: grid; grid-template-columns: repeat(3, 2.625in); grid-template-rows: repeat(10, 1in); column-gap: 0.125in; overflow: hidden; break-after: page; page-break-after: always; }
  .sheet:last-of-type { break-after: auto; page-break-after: auto; }
  .label { box-sizing: border-box; height: 1in; padding: 0.06in 0.12in 0.04in 0.16in; display: flex; flex-direction: column; justify-content: center; overflow: hidden; font-size: 9.5pt; line-height: 1.2; }
  .label.small { font-size: 8pt; }
  .label div { overflow: hidden; }
  .toolbar { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #fff8e1; border-bottom: 1px solid #e5d9a8; padding: 10px 16px; display: flex; gap: 12px; align-items: center; }
  @media screen {
    body { background: #e9edf3; }
    .sheet { background: #fff; margin: 16px auto; box-shadow: 0 1px 4px rgba(0, 0, 0, .18); }
    .label { outline: 1px dashed #d5dbe6; outline-offset: -1px; }
  }
  @media print { .toolbar { display: none; } }
</style>
</head>
<body>
{% if not pdf %}<div class="toolbar">{% if note %}<span>{{ note }}</span>{% endif %}<button type="button" onclick="window.print()">Print</button><span style="color:#666">Print at actual size (100%) on Avery 5160 or 8160 sheets.</span></div>{% endif %}
{% for sheet in sheets %}
<div class="sheet">{% for label in sheet %}
  <div class="label{% if label.small %} small{% endif %}">{% for line in label.lines %}<div>{{ line }}</div>{% endfor %}</div>{% endfor %}
</div>
{% endfor %}
</body>
</html>

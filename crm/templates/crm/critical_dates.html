{% extends "crm/base.html" %}
{% load crm_tags %}
{% block title %}Critical dates · ACMI Hub{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Critical dates</h1>
  <span class="spacer"></span>
  <span class="btn-row">
    <a class="btn btn-small{% if cal.view == 'month' %} btn-primary{% endif %}" href="?view=month{% if who_set %}&who_set=1{% for id in picked %}&who={{ id }}{% endfor %}{% endif %}">Month</a>
    <a class="btn btn-small{% if cal.view == 'week' %} btn-primary{% endif %}" href="?view=week&when={{ cal.month|date:'Y-m-d' }}{% if who_set %}&who_set=1{% for id in picked %}&who={{ id }}{% endfor %}{% endif %}">Week</a>
    <a class="btn btn-small{% if cal.view == 'day' %} btn-primary{% endif %}" href="?view=day&when={{ cal.month|date:'Y-m-d' }}{% if who_set %}&who_set=1{% for id in picked %}&who={{ id }}{% endfor %}{% endif %}">Day</a>
  </span>
</div>
<form method="get" class="inline-form" style="margin:0 0 12px;flex-wrap:wrap">
  <input type="hidden" name="view" value="{{ cal.view }}">
  <input type="hidden" name="when" value="{{ cal.anchor }}">
  <label class="muted lc-small">Campus
    <select name="campus" onchange="this.form.submit()">
      <option value="">All campuses</option>
      {% for c in campuses %}<option value="{{ c.pk }}"{% if campus_id == c.pk|stringformat:"s" %} selected{% endif %}>{{ c.code }}</option>{% endfor %}
    </select>
  </label>
  <label class="muted lc-small">Project
    <select name="project" onchange="this.form.submit()">
      <option value="">All projects</option>
      {% for p in projects %}<option value="{{ p.pk }}"{% if project_id == p.pk|stringformat:"s" %} selected{% endif %}>{{ p.name }}{% if p.campus %} · {{ p.campus.code }}{% endif %}</option>{% endfor %}
    </select>
  </label>
  {% if campus_id or project_id %}<a class="btn btn-small" href="?view={{ cal.view }}&when={{ cal.anchor }}">Clear</a>{% endif %}
</form>
{% include "crm/partials/critical_calendar.html" with cal=cal %}
{% endblock %}

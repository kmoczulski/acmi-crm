<div class="filters" style="padding:6px 10px">
  <span class="muted">Views:</span>
  {% for v in saved_views %}
    <a class="tag" href="?{{ v.query }}">{{ v.name }}{% if v.shared %} · shared{% endif %}</a>
    {% if v.owner_id == user.pk %}<form method="post" action="{% url 'crm:saved_view_delete' v.pk %}" style="display:inline">{% csrf_token %}<button class="btn-link btn-small" title="Delete view">×</button></form>{% endif %}
  {% empty %}<span class="muted">none yet</span>{% endfor %}
  <span style="flex:1"></span>
  <form method="post" action="{% url 'crm:saved_view_save' %}" class="inline-form">{% csrf_token %}
    <input type="hidden" name="object_type" value="{{ object_type }}">
    <input type="hidden" name="query" value="{{ current_qs }}">
    <input name="name" placeholder="Save current view as…" size="22">
    <label style="flex-direction:row;gap:4px"><input type="checkbox" name="shared"> Shared</label>
    <button class="btn-small">Save view</button>
  </form>
</div>

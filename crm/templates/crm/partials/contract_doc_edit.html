{% load crm_tags %}
<details class="lc-small ct-edit"><summary>edit</summary>
  <form method="post" enctype="multipart/form-data" class="fields">{% csrf_token %}<input type="hidden" name="action" value="doc_edit"><input type="hidden" name="doc" value="{{ d.pk }}">
    <label>Type <select name="kind">{% for v, l in kinds|offer:d.kind %}<option value="{{ v }}"{% if v == d.kind %} selected{% endif %}>{{ l }}</option>{% endfor %}</select></label>
    <label>Title <input name="title" value="{{ d.title }}"></label>
    <label>Dated <input type="date" name="dated" value="{{ d.dated|date:'Y-m-d' }}"></label>
    <label>Draft sent by <select name="sent_by">{% for v, l in senders|offer:d.sent_by %}<option value="{{ v }}"{% if v == d.sent_by %} selected{% endif %}>{{ l }}</option>{% endfor %}</select></label>
    <label>Link <input name="url" value="{{ d.url }}"></label>
    <label>Summary <textarea name="summary" rows="2">{{ d.summary }}</textarea></label>
    <label>Replace the file <input type="file" name="file"></label>
    <button class="btn btn-small btn-primary">Save</button>
  </form>
  {% if can_manage %}<form method="post" onsubmit="return confirm('Remove {{ d.title|escapejs }} and its file?')">{% csrf_token %}<input type="hidden" name="action" value="doc_delete"><input type="hidden" name="doc" value="{{ d.pk }}">
    <button class="btn-link lc-small">Remove document</button></form>{% endif %}
</details>

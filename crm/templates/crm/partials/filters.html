<form method="get" class="filters">
  <label>Search<input type="search" name="q" value="{{ request.GET.q }}" placeholder="{{ search_placeholder }}"></label>
  {% if object_type == 'company' %}
  <label>Stage
    <details class="checks"><summary>{% if selected.status %}{{ selected.status|length }} selected{% else %}Any{% endif %}</summary>
      <div>{% for v, l in choices.statuses %}<label><input type="checkbox" name="status" value="{{ v }}" {% if v in selected.status %}checked{% endif %}>{{ l }}</label>{% endfor %}</div></details>
  </label>
  <label>Sector<input name="sector" value="{{ request.GET.sector }}" size="14"></label>
  <label>Fit
    <select name="fit">
      <option value="">Any</option>
      <option value="5" {% if request.GET.fit == "5" %}selected{% endif %}>5</option>
      <option value="4" {% if request.GET.fit == "4" %}selected{% endif %}>4+</option>
      <option value="3" {% if request.GET.fit == "3" %}selected{% endif %}>3+</option>
      <option value="2" {% if request.GET.fit == "2" %}selected{% endif %}>2+</option>
      <option value="none" {% if request.GET.fit == "none" %}selected{% endif %}>Not scored</option>
    </select>
  </label>
  <label>Project
    <select name="project">
      <option value="">Any</option>
      {% for pr in projects %}<option value="{{ pr.pk }}" {% if request.GET.project == pr.pk|stringformat:'s' %}selected{% endif %}>{{ pr.name }}</option>{% endfor %}
    </select>
  </label>
  <label>Campus
    <select name="campus">
      <option value="">Any</option>
      {% for c in campuses %}<option value="{{ c.code }}" {% if request.GET.campus == c.code %}selected{% endif %}>{{ c.code }}</option>{% endfor %}
      <option value="own" {% if request.GET.campus == "own" %}selected{% endif %}>Own campus</option>
      <option value="none" {% if request.GET.campus == "none" %}selected{% endif %}>None</option>
      <option value="unknown" {% if request.GET.campus == "unknown" %}selected{% endif %}>Not known</option>
    </select>
  </label>
  {% else %}
  <label>Company<input name="company" value="{{ request.GET.company }}" size="14"></label>
  <label>Email blasts
    <select name="blasts">
      <option value="">Any</option>
      <option value="in" {% if request.GET.blasts == 'in' %}selected{% endif %}>In blasts</option>
      <option value="excluded" {% if request.GET.blasts == 'excluded' %}selected{% endif %}>Excluded</option>
      <option value="bad" {% if request.GET.blasts == 'bad' %}selected{% endif %}>Email bad</option>
    </select>
  </label>
  {% endif %}
  <label>Priority
    <details class="checks"><summary>{% if selected.priority %}{{ selected.priority|join:", " }}{% else %}Any{% endif %}</summary>
      <div>{% for v, l in choices.priorities %}<label><input type="checkbox" name="priority" value="{{ v }}" {% if v in selected.priority %}checked{% endif %}>{{ l }}</label>{% endfor %}</div></details>
  </label>
  <label>Owner
    <select name="owner">
      <option value="">Anyone</option>
      <option value="me" {% if request.GET.owner == 'me' %}selected{% endif %}>Me</option>
      <option value="none" {% if request.GET.owner == 'none' %}selected{% endif %}>Unassigned</option>
      {% for u in users %}<option value="{{ u.pk }}" {% if request.GET.owner == u.pk|stringformat:'s' %}selected{% endif %}>{{ u.get_full_name|default:u.username }}</option>{% endfor %}
    </select>
  </label>
  <label>Last touch
    <select name="touch">{% for v, l in choices.touch %}<option value="{{ v }}" {% if request.GET.touch == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
  </label>
  <label>Last response
    <select name="response"><option value="">Any</option>{% for r in choices.responses %}<option {% if request.GET.response == r %}selected{% endif %}>{{ r }}</option>{% endfor %}</select>
  </label>
  <label>Flag
    <select name="flag">
      <option value="">Any</option>
      <option value="not_excluded" {% if request.GET.flag == 'not_excluded' %}selected{% endif %}>Not excluded</option>
      <option value="none" {% if request.GET.flag == 'none' %}selected{% endif %}>No flags</option>
      {% for f in flag_options %}<option {% if request.GET.flag == f %}selected{% endif %}>{{ f }}</option>{% endfor %}
    </select>
  </label>
  <input type="hidden" name="sort" value="{{ table.sort }}">
  <details class="columns"><summary>Columns</summary>
    <div class="grid">{% for c in all_columns %}<label style="flex-direction:row;gap:4px;color:inherit"><input type="checkbox" name="cols" value="{{ c.key }}" {% if c in columns %}checked{% endif %}>{{ c.label }}</label>{% endfor %}</div>
  </details>
  <button class="btn-primary">Apply</button>
  <a href="?">Reset</a>
</form>

{% comment %}Delete one client search `a` from a list row; comes back to the same page. Its creator or a manager only.{% endcomment %}
{% if IS_MANAGER or a.created_by_id == request.user.pk %}<form method="post" action="{{ a.get_absolute_url }}" style="margin:0" onsubmit="return confirm('Delete “{{ a.name|escapejs }}” and the reports written for it? The client link stops working. The sites stay in Land.')">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="link-btn" name="action" value="delete" aria-label="Delete {{ a.name }}">Delete</button></form>{% endif %}

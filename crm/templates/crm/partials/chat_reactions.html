{# The emoji on one message as chips (crm/chat/views.py react, chat_messages.html). A custom emoji is shown, not clickable. #}{% for r in reactions %}<button type="button" class="chat-chip{% if r.mine %} mine{% endif %}" data-emoji="{{ r.key }}" aria-pressed="{% if r.mine %}true{% else %}false{% endif %}" aria-label="{{ r.label }}, {{ r.count }}"{% if r.custom %} disabled{% endif %}>{% if r.image %}<img class="chat-cemoji" src="{{ r.image }}" alt="{{ r.label }}">{% else %}<span class="chat-emo">{{ r.label }}</span>{% endif %}<b>{{ r.count }}</b></button>{% endfor %}
